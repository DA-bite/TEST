name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so the deploy job can publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch or pull request at a time. A run that is already
# deploying is never cancelled halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reads the Pages settings, including the path the site is served from
      # (for example /my-repo). Skipped on pull requests, which never deploy.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Test site
        run: npm test
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy from pushes to main (or a manual run), never from pull requests.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
